name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore signing keystore
        env:
          KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "$KEY_BASE64" ]; then
            mkdir -p keystore
            echo "$KEY_BASE64" | base64 -d > keystore/release.jks
            echo "SIGNING_STORE_FILE=keystore/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_ENV"
          else
            echo "No SIGNING_KEY_BASE64 secret — building unsigned debug-only APK."
            echo "signed=false" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Build debug APK (fallback)
        if: env.signed != 'true'
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          if [ -d app/build/outputs/apk/debug ]; then
            cp app/build/outputs/apk/debug/*.apk out/ 2>/dev/null || true
          fi
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TextGrab-zh-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: env.signed == 'true' && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TextGrab 中文版 build ${{ github.run_number }}
          files: out/*.apk
